site_name: RG35XX-SP BSP
site_description: Anbernic RG35XX-SP (Allwinner H700) 主线内核、固件与硬件文档
site_url: https://hsyysy.github.io/rg35xxsp/
repo_url: https://github.com/hsyysy/rg35xxsp
repo_name: hsyysy/rg35xxsp

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
    - 主线内核: mainline-guide.md
    - 原厂镜像: stock-image-guide.md
    - rootfs 准备: rootfs-prep.md
  - 参考:
    - 硬件事实: device-facts.md
    - 上游支持与 BSP: mainline-support.md
  - 状态:
    - 支持与限制: status.md
    - 显示与 DE33: display.md
    - 视频硬解: video.md
    - 启动告警: boot-warning-cleanup.md
    - 启动日志: kernel-debug-branches.md
    - GPU / GLES: gpu-gles-test.md

validation:
  links:
    anchors: warn
